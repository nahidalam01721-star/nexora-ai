<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12"><title>Nexora AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#edf0fa;font:15px Arial,sans-serif}.app{display:flex;height:100vh;min-height:580px}.side{width:255px;background:#0c0f18;border-right:1px solid #242a3b;padding:22px 15px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:bold;margin:5px 8px 28px}.brand span{color:#a99bff}.new,.nav button,.history button{width:100%;text-align:left;border:0;border-radius:10px;padding:12px;background:transparent;color:#aeb6c9;cursor:pointer}.new{background:#211e38;border:1px solid #393354;color:white;margin-bottom:25px}.label{font-size:10px;letter-spacing:1.5px;color:#758099;margin:12px 8px}.nav button:hover,.history button:hover{background:#1b2030;color:white}.history{margin-top:18px}.profile{margin-top:auto;border-top:1px solid #242a3b;padding:18px 6px;color:#9ba5b9;font-size:12px}.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 50% 15%,#19172c,#090b12 65%)}header{height:65px;border-bottom:1px solid #ffffff0d;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#e8e9f4}.model{background:#171b29;color:white;border:1px solid #30364b;border-radius:9px;padding:9px 12px}.tag{font-size:11px;color:#9da8bd;border:1px solid #30364b;padding:7px 10px;border-radius:20px}.content{flex:1;overflow:auto;display:flex;justify-content:center;padding:25px}.welcome{margin:auto;text-align:center;max-width:700px}.orb{margin:0 auto 22px;width:65px;height:65px;border-radius:20px;background:linear-gradient(140deg,#38305e,#171b2b);display:grid;place-items:center;color:#c6bbff;font-size:30px}.eyebrow{color:#aa9dff;letter-spacing:2px;font-size:10px;font-weight:bold}.welcome h1{font-size:clamp(34px,5vw,52px);letter-spacing:-2px;margin:13px 0}.welcome p{color:#929bb0;font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px auto;max-width:570px}.card{padding:15px;text-align:left;border:1px solid #292f43;border-radius:12px;background:#141827;color:#e8eafa;cursor:pointer}.card small{display:block;color:#8993aa;margin-top:6px}.messages{width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px}.msg{padding:12px 15px;border-radius:13px;background:#171c2a;max-width:85%;white-space:pre-wrap;line-height:1.6}.msg.user{align-self:flex-end;background:#24213b}.msg.bot{align-self:flex-start}.composer-wrap{width:min(760px,calc(100% - 35px));margin:0 auto;padding:10px 0 18px}.composer{border:1px solid #343a50;background:#151a28;border-radius:16px;padding:12px}.composer textarea{width:100%;resize:none;max-height:130px;background:none;border:0;outline:0;color:white;font:15px Arial;padding:5px}.bottom{display:flex;justify-content:space-between;align-items:center;color:#808ba2;font-size:11px}.send{border:0;border-radius:10px;background:#a99bff;color:#151326;width:35px;height:35px;font-size:22px;cursor:pointer}.note{text-align:center;color:#67728a;font-size:10px;margin-top:9px}.hidden{display:none!important}.mobile{display:none}
@media(max-width:700px){.side{display:none}.mobile{display:block}header{padding:0 13px}.content{padding:18px 12px}.welcome h1{font-size:37px}.cards{gap:7px}.card{padding:12px;font-size:12px}.card small{font-size:10px}.composer-wrap{width:calc(100% - 20px)}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">✦ Nexora <span>AI</span></div><button class="new" onclick="newChat()">＋ New chat</button><div class="label">WORKSPACE</div><nav class="nav"><button>◈ Chat</button><button onclick="notice('Explore AI is coming soon.')">⌘ Explore AI</button><button onclick="notice('Saved prompts are coming soon.')">▣ Saved prompts</button></nav><div class="label history">RECENT CHATS</div><div id="history"></div><div class="profile">● Guest User<br><br>Free preview workspace</div></aside>
<main class="main"><header><div><button class="model" onclick="notice('More AI models will be added after provider setup.')">Nexora Assistant　⌄</button></div><span class="tag">● Preview</span></header>
<section class="content"><div class="welcome" id="welcome"><div class="orb">✦</div><div class="eyebrow">YOUR AI, YOUR WORLD</div><h1>What can I help you with?</h1><p>Explore ideas, learn something new, or create something amazing.</p><div class="cards"><button class="card" onclick="suggest('Explain a difficult topic in simple Bangla.')">✧ Learn something<small>Explain a topic simply</small></button><button class="card" onclick="suggest('Help me brainstorm a creative project.')">⌁ Get creative<small>Brainstorm fresh ideas</small></button><button class="card" onclick="suggest('Help me write a professional email.')">✎ Write anything<small>Draft, improve, rewrite</small></button><button class="card" onclick="suggest('Help me understand this code step by step.')">⌘ Build with code<small>Understand and create code</small></button></div></div><div class="messages hidden" id="messages"></div></section>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="2" placeholder="Message Nexora..."></textarea><div class="bottom"><span>✦ AI assistant</span><button class="send" type="submit">↑</button></div></form><div class="note">Nexora AI Preview · Live AI answers will be enabled after secure AI setup.</div></div></main></div>
<script>
let chats=[];let current=null;
function notice(t){alert(t)}
function newChat(){current=null;document.getElementById('messages').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden');document.getElementById('input').value='';}
function suggest(t){send(t)}
function renderHistory(){let h=document.getElementById('history');h.innerHTML='';chats.forEach((c,i)=>{let b=document.createElement('button');b.textContent='◦ '+c.title;b.onclick=()=>showChat(i);h.appendChild(b)})}
function showChat(i){current=i;let m=document.getElementById('messages');m.innerHTML='';chats[i].items.forEach(x=>add(x.role,x.text,false));m.classList.remove('hidden');document.getElementById('welcome').classList.add('hidden')}
function add(role,text,save=true){let d=document.createElement('div');d.className='msg '+role;d.textContent=text;document.getElementById('messages').appendChild(d);if(save&&current!==null)chats[current].items.push({role,text});}
function send(t){t=t.trim();if(!t)return;if(current===null){current=chats.length;chats.push({title:t.slice(0,30),items:[]});renderHistory()}document.getElementById('welcome').classList.add('hidden');document.getElementById('messages').classList.remove('hidden');add('user',t);add('bot','Nexora AI is currently in preview mode. This interface is ready, but a secure AI provider has not been connected yet. We will add live AI responses in the next development step.');document.getElementById('input').value='';}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(document.getElementById('input').value)});
</script></body></html>
